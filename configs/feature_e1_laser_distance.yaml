# E1 trajectory-feature ablation: target/current laser coordinates plus node-laser distances.

model:
  node_feature_dim: 12
  edge_feature_dim: 5
  hidden_dim: 64
  spatial:
    gnn_type: "GATv2Conv"
    num_layers: 1
    heads: 2
    dropout: 0.1
    use_checkpoint: false
  temporal:
    num_layers: 2
    heads: 4
    ff_dim: 256
    dropout: 0.1
    max_seq_len: 32
  fusion:
    type: "cross_attention"
    heads: 4
  decoder:
    temperature: true
    stress: false
    displacement: false
    heat_flux: false

material:
  name: "Ti-6Al-4V"
  density: 4430.0
  specific_heat: 526.3
  thermal_conductivity: 6.7
  thermal_expansion: 8.6e-6
  solidus_temp: 1604.85
  liquidus_temp: 1654.85
  emissivity: 0.35
  convection_coeff: 10.0
  ambient_temp: 20.0

physics:
  heat_conduction: true
  fourier_flux: false
  boundary_convection: true
  boundary_radiation: false
  initial_condition: true
  coordinate_scale_to_m: 1.0e-3
  time_scale_to_s: 1.0e-3
  normalize_pde_residual: true
  pde_temperature_scale: 1000.0
  pde_time_scale: 1.0
  boundary_label_mode: "positive_dirichlet"

loss:
  lambda_T: 1.0
  lambda_PDE: 0.1
  lambda_BC: 0.1
  lambda_IC: 0.5
  lambda_smooth: 0.01

training:
  batch_size: 1
  accumulate_grad_batches: 4
  epochs: 50
  lr: 1.0e-3
  lr_scheduler: "cosine"
  weight_decay: 1.0e-5
  grad_clip: 1.0
  early_stopping_patience: 20
  use_amp: true
  amp_dtype: "auto"

data:
  vtu_dir: "data/raw"
  time_sampling: "log"
  window_size: 4
  predict_steps: 1
  k_neighbors: 16
  use_mesh_edges: true
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  laser_feature_group: "E1"
  laser_path_mode: "additive_z_scan"
  laser_path_time_scale_to_s: 8.497742224741091e-4
  laser_path_time_offset_s: -0.0111044328766
  laser_start_point_mm: [10.3165, -10.1562, 0.1]
  laser_scan_direction: [0.0, 1.0, 0.0]
  laser_scan_length_mm: 20.3124
  laser_hatch_direction: [-1.0, 0.0, 0.0]
  laser_hatch_count: 104
  laser_hatch_spacing_mm: 0.2004
  laser_layer_count: 10
  laser_layer_thickness_mm: 0.1
  laser_velocity_mm_s: 600.0
  laser_each_path_time_s: 0.001
  laser_each_layer_time_s: 0.0
  laser_alternate_layer_scan_direction: false
  laser_reverse_hatch_order_parity: 1

logging:
  log_dir: "logs"
  experiment_name: "feature_e1_laser_distance"
  save_every: 20
  eval_every: 5
  save_hot_checkpoint: true
  hot_checkpoint_metric: "TempF1AboveSolidus"
  hot_checkpoint_mode: "max"
  use_wandb: false
