# Ablation Z240: endpoint ETA rescue with learned cold-to-hot support.
#
# z239 recovered most solidus recall without z236's broad cold false-hot, but
# still missed an endpoint-adjacent cold-start hotspot at step 2013/node 35707.
# That true miss had prearrival/endpoint/time-until support and cold-to-hot
# around 0.55, while the z236 cold false-hot had similar path gates but
# cold-to-hot around 0.44.  This variant keeps the reverse-odd additive_z_scan
# alignment, lowers the endpoint program-track guard to catch the true miss, and
# requires cold-to-hot support on the endpoint ETA rescue branch.
#
# Base note from z239/z236:
# Ablation Z236: endpoint ETA rescue without learned cold gate.
# z235 reduced MaxError but still missed a true endpoint-adjacent hotspot at
# step 2013 / node 35707: prearrival=0.557 and endpoint=0.445 were positive,
# but program-track=0.447 stayed below the 0.600 guard, so the residual gate
# never opened.  This variant uses the XML path timing feature instead:
# prearrival + endpoint + near-future time_until support.
#
# Base z234 note:
# Ablation Z234: z233 endpoint cold-start rescue with a lower cold-to-hot gate.
# Uses the additive_z_scan snake path as a process prior.  The post branch is
# deliberately stricter than z227: it requires recent post-arrival, wake, path
# body, program-track, and cold-to-hot evidence before enabling the residual
# floor, so broad scanned-path phase regions stay suppressed.  The post branch
# final temperature is capped by hotspot_specialist_temp plus a margin to avoid
# adding a large residual to cooling or moderate-hot nodes.
# z229 reduced MaxError but created a cold false-hot at step 2091 where
# prearrival=0.523 and target_heat=0.128 barely cleared the 0.115 support
# threshold.  This variant raises only that shared heat/path-body support
# threshold to 0.140, keeping the sweep threshold at 0.120 so the historical
# true cold-start case with sweep around 0.131 can still pass.
# z230 suppressed the z229 cold false-hot, but missed a true endpoint-adjacent
# cold-start hotspot at step 2095: prearrival=0.534, endpoint=0.440,
# program-track=0.825, cold-to-hot=0.307, while body/wake/sweep were zero.
# This variant keeps the stricter 0.140 heat support, but adds a dedicated
# prearrival_endpoint_track_cold_all support path that does not require body/wake.
# z231 reopened a cold false-hot at step 2017 with endpoint=0.435 and
# program-track=0.466.  z232 raised the endpoint program-track threshold to
# 0.750 and suppressed that false-hot, but then missed a true endpoint-adjacent
# hotspot at step 2054 with program-track=0.641.  z233 sets the threshold to
# 0.600, between those two diagnosed cases. z233 then missed a true hotspot at
# step 2095 with prearrival=0.534, endpoint=0.440, program-track=0.825, but
# cold-to-hot=0.262; z234 lowers only the endpoint cold-to-hot threshold.
#
# Base: Z226 XML reverse-odd wake/body/track gate plus cold-to-hot rescue.
# z226 keeps z225's 1900 C floor/support path, but slightly lowers the weak
# cold-branch program-track threshold from 0.4500 to 0.4400.  This targets the
# z225 true-hot miss whose program-track gate was 0.4466 while all other cold
# rescue evidence was already positive.
# z222 keeps z221's 1900 C floor, but adds a mid-tier strong-support path for
# true cold-start hotspots that sit inside the additive_z_scan body/wake corridor
# while endpoint and neighbor-hot support are still zero.
#
# Original base: Z191/Z199 XML wake/tail residual gate.
#
# z113 shows the deterministic floor restores solidus recall but over-fires on
# cold path-body corridor nodes whose arrival gate is tiny. z114 shows a pure
# track-heat guard is too strict for real melt-pool arrivals. z115-z117 show
# z120 lowers the pre-arrival/arrival threshold enough to recover the recurring
# true cold-start hotspot, but it reopens a weak-arrival false-hot node. The two
# nodes have similar pre-arrival/arrival gates, while sweep support separates
# them better: true hotspot sweep is about 0.131, false-hot sweep is about 0.039.
# z121 showed sweep-only support is too narrow for endpoint/ellipsoid-edge nodes.
# z123 showed path-body support is too broad and reopens cold false-hot nodes.
# z124 misses true body-corridor cold-start hotspots when sweep/endpoint are low.
# z130 restores hotspot recall but the worst false-hot has pre-arrival=0.5009.
# z166 shows direct XML-prior gating cuts the worst error but the specialist
# temperature remains too low. z167 shows the 0.530 phase edge is brittle but
# stronger specialist losses overfire. This variant keeps z166 losses, softens
# the phase edge to 0.520, and uses the residual prior as a specialist temp
# floor so confirmed path candidates are not left near ambient temperature.
# z168 restored non-zero solidus recall with a deterministic specialist floor,`r`n# but false-hot errors appeared in broad process/neighbor-supported regions.`r`n# z170 improved global errors by stronger false-hot suppression, but nearly lost`r`n# solidus recall. This variant removes the hard floor and instead trains a`r`n# laser_residual_head behind an XML phase event gate: pre/post phase plus`r`n# active path and body/sweep/target/endpoint support, with no neighbor-only support.

